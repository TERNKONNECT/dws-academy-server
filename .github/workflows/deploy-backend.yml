name: Deploy Backend
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dws_academy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Syntax check
        run: |
          find . -name '*.js' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 node --check

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install


      - name: Install Serverless Framework
        run: npm install -g serverless@3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Every variable the running app reads. PAYSTACK_SECRET_KEY was missing, which
      # meant the webhook HMAC'd against an empty string and rejected every callback.
      - name: Create .env file
        run: |
          {
            echo "NODE_ENV=production"
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}"
            echo "AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}"
            echo "AWS_S3_REGION=${{ secrets.AWS_REGION }}"
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"
            echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}"
            echo "PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}"
            echo "PAYSTACK_SUBACCOUNT=${{ secrets.PAYSTACK_SUBACCOUNT }}"
            echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}"
            echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}"
            echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}"
          } >> .env

      # Fail loudly at deploy time rather than silently at the first webhook.
      - name: Verify required secrets are present
        run: |
          for key in DATABASE_URL JWT_SECRET FRONTEND_URL PAYSTACK_SECRET_KEY RESEND_API_KEY; do
            if ! grep -q "^${key}=." .env; then
              echo "::error::${key} is empty. Set it in repository secrets."
              exit 1
            fi
          done

      - name: Sync Database Schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/sync-db.js

      - name: Serverless Deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
        run: serverless deploy --stage prod
